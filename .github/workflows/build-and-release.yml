name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
          - MinSizeRel
          - RelWithDebInfo

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            cmake_arch: x64
            msvc_arch: amd64
          - name: x86
            cmake_arch: Win32
            msvc_arch: amd64_x86
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure CMake
        run: |
          cmake -B build-${{ matrix.name }} -G "Visual Studio 17 2022" -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: |
          cmake --build build-${{ matrix.name }} --config ${{ env.BUILD_TYPE }}

      - name: Package Artifacts
        shell: pwsh
        run: |
          $buildType = "${{ env.BUILD_TYPE }}"
          $arch = "${{ matrix.name }}"
          $packageDir = "artifacts/log-hook-$arch"

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "build-$arch/$buildType/HookDLL.dll" "$packageDir/HookDLL.dll"
          Copy-Item "build-$arch/$buildType/injector.exe" "$packageDir/injector.exe"
          Compress-Archive -Path "$packageDir/*" -DestinationPath "artifacts/log-hook-$arch.zip" -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: log-hook-${{ matrix.name }}
          path: artifacts/log-hook-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ github.run_number }}
          name: Build v${{ github.run_number }}
          files: |
            release-assets/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
